name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: true

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    # Required to create the release; the default token is read-only.
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Build release notes from CHANGELOG
      id: notes
      shell: pwsh
      env:
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        $source = ./scripts/build-release-notes.ps1 -Tag $env:TAG -OutFile release-notes.md -Repo $env:REPO
        if ($LASTEXITCODE -ne 0) { exit 1 }
        if ($source -eq "fallback") {
          Write-Host "::warning::No CHANGELOG section for $env:TAG - appending auto-generated notes instead"
        }
        # Let GitHub append its generated notes only when the CHANGELOG had nothing.
        # Must be lowercase: the action compares the raw input against 'true'.
        $generate = if ($source -eq 'fallback') { 'true' } else { 'false' }
        "generate=$generate" >> $env:GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Guardian-DB ${{ github.ref_name }}
        body_path: release-notes.md
        generate_release_notes: ${{ steps.notes.outputs.generate }}
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Install Protocol Buffers compiler
      # Explicit bash: the default shell on the Windows runner is pwsh,
      # where this script is a syntax error.
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
        elif [ "$RUNNER_OS" == "macOS" ]; then
          brew install protobuf
        elif [ "$RUNNER_OS" == "Windows" ]; then
          choco install protoc
        fi

    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Build guardian-db
      run: cargo build --release --all-features

    - name: Run tests
      run: cargo test --release --all-features

    - name: Build documentation
      run: cargo doc --no-deps --all-features

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [create-release, build-and-test]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install Protocol Buffers compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Publish to crates.io
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}